# XcodeGen spec — source of truth for the Xcode project.
# The .xcodeproj is generated (in CI via `xcodegen generate`) and is NOT committed.
#
# Single-app build for free (unpaid) signing: only the iPhone app (Forge), its tests, and
# the shared framework (WorkoutDataKit). No paid entitlements (App Group / HealthKit /
# iCloud / Siri) are declared. The Apple Watch app, Siri-intent extensions, and old widget
# have been removed. A rest-timer Live Activity may be added later as the one extension.

name: Forge

options:
  bundleIdPrefix: com.rodrigomaia
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""

packages:
  Charts:
    url: https://github.com/danielgindi/Charts
    from: "5.1.0"

targets:
  WorkoutDataKit:
    type: framework
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rodrigomaia.forge.WorkoutDataKit
        INFOPLIST_FILE: WorkoutDataKit/Info.plist
        DEFINES_MODULE: "YES"
        APPLICATION_EXTENSION_API_ONLY: "YES"
        SKIP_INSTALL: "YES"
    sources:
      - path: WorkoutDataKit
        excludes:
          - everkinetic-data
      - path: WorkoutDataKit/everkinetic-data
        type: folder
      # WorkoutDataKit uses its own WorkoutDataKit/Extension/OSLog+Logs.swift (globbed above);
      # the Shared one has the same basename and would collide, so it is NOT added here.
      - Shared/Benchmark.swift

  Forge:
    type: application
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rodrigomaia.forge
        INFOPLIST_FILE: Forge/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: "YES"
    sources:
      - path: Forge
        excludes:
          - quotes
          - iron_backup_file_images
      - path: Forge/quotes
        type: folder
      - path: Forge/iron_backup_file_images
        type: folder
      - path: Shared
    dependencies:
      - target: WorkoutDataKit
      - target: RestTimerWidget
      - package: Charts
        product: DGCharts

  RestTimerWidget:
    type: app-extension
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rodrigomaia.forge.RestTimerWidget
        INFOPLIST_FILE: RestTimerWidget/Info.plist
        SKIP_INSTALL: "YES"
    sources:
      - path: RestTimerWidget
      # The Live Activity attributes are shared with the app (compiled into both targets).
      - Shared/RestTimerActivity.swift

  ForgeTests:
    type: bundle.unit-test
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rodrigomaia.forge.tests
        INFOPLIST_FILE: ForgeTests/Info.plist
    sources:
      - path: ForgeTests
        excludes:
          - workout_data
          - iron_backups
      - path: ForgeTests/workout_data
        type: folder
      - path: ForgeTests/iron_backups
        type: folder
    dependencies:
      - target: Forge

schemes:
  Forge:
    build:
      targets:
        Forge: all
    test:
      targets:
        - ForgeTests
