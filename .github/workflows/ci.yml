name: CI

# Builds/tests Forge and produces artifacts (UI screenshots + an unsigned .ipa) on a
# GitHub-hosted macOS runner — the only build environment (the maintainer has no Mac).
#
# Built with Xcode 26 (the newest installed on the runner) so the app links against the iOS 26
# SDK and the native UI adopts Liquid Glass on iOS 26 devices. Deployment target stays iOS 17,
# so it still runs on iOS 17+. The .xcodeproj is generated from project.yml each run.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build, test & screenshots (iOS Simulator)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select newest Xcode (26 for Liquid Glass)
        run: |
          set -euo pipefail
          XPATH="$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)"
          echo "Selecting $XPATH"
          sudo xcode-select -s "$XPATH"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build & test
        run: |
          set -euo pipefail
          DEVICE="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ {gsub(/^ +| +$/, "", $1); print $1; exit}')"
          echo "Testing on: $DEVICE"
          xcodebuild test \
            -project Forge.xcodeproj \
            -scheme Forge \
            -destination "platform=iOS Simulator,name=$DEVICE,OS=latest" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: TestResults.xcresult
          if-no-files-found: ignore

  package-ipa:
    name: Package unsigned .ipa (AltStore / SideStore)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select newest Xcode (26 for Liquid Glass)
        run: |
          set -euo pipefail
          XPATH="$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)"
          echo "Selecting $XPATH"
          sudo xcode-select -s "$XPATH"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned (Release, device)
        run: |
          xcodebuild build \
            -project Forge.xcodeproj \
            -scheme Forge \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package .ipa
        run: |
          set -euo pipefail
          APP="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)"
          echo "Packaging: $APP"
          rm -rf Payload
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry Forge-unsigned.ipa Payload
          ls -lh Forge-unsigned.ipa

      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: Forge-unsigned-ipa
          path: Forge-unsigned.ipa
          if-no-files-found: error
