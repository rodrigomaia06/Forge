name: CI

# Builds and tests Forge on a GitHub-hosted macOS runner.
# This is the ONLY way the project is built/tested — the maintainer has no Mac.
#
# Notes for the first run (expect to iterate once from the Actions log):
#  - Builds for the iOS Simulator, which does NOT enforce code signing or
#    entitlements, so this stays green even while the project still has the
#    paid-only App Group / HealthKit / iCloud / Siri capabilities (removed in F3).
#  - CODE_SIGNING_ALLOWED=NO lets the app + embedded watch/extensions build
#    unsigned for the simulator.
#  - Pin XCODE_VERSION and SIMULATOR_NAME to values actually present on the
#    runner image (see the "Show available Xcodes / simulators" step output)
#    and adjust if the first run reports them missing.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  XCODE_VERSION: "15.4"
  SIMULATOR_NAME: "iPhone 15"

jobs:
  build-test:
    name: Build & Test (iOS Simulator)
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"

      - name: Show available Xcodes / simulators (diagnostics for first run)
        run: |
          echo "Xcode:"; xcodebuild -version
          echo "Installed Xcodes:"; ls /Applications | grep -i Xcode || true
          echo "Schemes:"; xcodebuild -project Iron.xcodeproj -list || true
          echo "iPhone simulators:"; xcrun simctl list devices available | grep -i iphone || true

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project Iron.xcodeproj -scheme Iron

      - name: Build & test
        run: |
          xcodebuild test \
            -project Iron.xcodeproj \
            -scheme Iron \
            -destination "platform=iOS Simulator,name=${SIMULATOR_NAME},OS=latest" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: TestResults.xcresult
          if-no-files-found: ignore
