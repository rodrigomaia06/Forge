name: CI

# Builds, tests and photographs Forge on a GitHub-hosted macOS runner, the only build environment
# (the maintainer has no Mac). Three jobs, all running in parallel:
#
#   test        unit and integration tests (ForgeTests, minus the capture tests)
#   screenshots the UI walkthrough that photographs the running app, plus the component captures
#   ipa         an unsigned .ipa for AltStore / SideStore
#
# Tests and screenshots used to share one job, so a green build waited on a full UI walkthrough.
# Split, the wall clock is the slower of the two rather than their sum, and a test failure is
# reported without the screenshot run having to finish.
#
# The .xcodeproj is generated from project.yml each run.

on:
  # Run on every branch push, so each run is named after its commit rather than a pull request. A push
  # run still reports its status on any open PR for the same commit, so PR checks keep working.
  push:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (unit & integration)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select newest Xcode
        run: .github/scripts/select-xcode.sh

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Pick a simulator
        run: .github/scripts/pick-simulator.sh

      - name: Run tests
        run: |
          set -euo pipefail
          echo "Testing on: $SIMULATOR_NAME"
          # ScreenshotTests only renders components to PNGs; it runs in the screenshots job instead.
          xcodebuild test \
            -project Forge.xcodeproj \
            -scheme Forge \
            -destination "platform=iOS Simulator,name=$SIMULATOR_NAME,OS=latest" \
            -resultBundlePath TestResults.xcresult \
            -only-testing:ForgeTests \
            -skip-testing:ForgeTests/ScreenshotTests \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: TestResults.xcresult
          if-no-files-found: ignore

  screenshots:
    name: Screenshots (iOS Simulator)
    runs-on: macos-15
    # The walkthrough opens every screen, sheet, menu and alert in the app, so it is the long job.
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select newest Xcode
        run: .github/scripts/select-xcode.sh

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Pick a simulator
        run: .github/scripts/pick-simulator.sh

      - name: Capture
        env:
          # Read by ScreenshotTests, which writes each PNG here as well as attaching it.
          # SIMCTL_CHILD_ is what carries a variable into the process running inside the simulator.
          SIMCTL_CHILD_FORGE_SCREENSHOT_DIR: ${{ github.workspace }}/screenshots
        run: |
          set -euo pipefail
          echo "Capturing on: $SIMULATOR_NAME"
          mkdir -p "$SIMCTL_CHILD_FORGE_SCREENSHOT_DIR"
          # A capture run should hand back every screen it did reach, so one broken path does not
          # cost the rest. The walkthrough records a skipped step rather than failing the run.
          xcodebuild test \
            -project Forge.xcodeproj \
            -scheme Forge \
            -destination "platform=iOS Simulator,name=$SIMULATOR_NAME,OS=latest" \
            -resultBundlePath ScreenshotResults.xcresult \
            -only-testing:ForgeUITests \
            -only-testing:ForgeTests/ScreenshotTests \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Recover the screenshots from the result bundle
        if: always()
        run: |
          set -euo pipefail
          DIR="${{ github.workspace }}/screenshots"
          RAW="${{ github.workspace }}/screenshots-raw"
          mkdir -p "$DIR" "$RAW"
          xcrun xcresulttool export attachments \
            --path ScreenshotResults.xcresult \
            --output-path "$RAW" || {
              echo 'Could not export attachments.'
              exit 0
            }
          .github/scripts/recover-screenshots.py "$RAW" "$DIR"
          echo "Recovered:"
          ls -1 "$DIR"

      - name: Upload the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: ${{ github.workspace }}/screenshots
          if-no-files-found: warn

      - name: Upload the capture results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ScreenshotResults
          path: ScreenshotResults.xcresult
          if-no-files-found: ignore

  ipa:
    name: Package unsigned .ipa (AltStore / SideStore)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select newest Xcode
        run: .github/scripts/select-xcode.sh

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned (Release, device)
        run: |
          xcodebuild build \
            -project Forge.xcodeproj \
            -scheme Forge \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package .ipa
        run: |
          set -euo pipefail
          APP="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)"
          echo "Packaging: $APP"
          rm -rf Payload
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry Forge-unsigned.ipa Payload
          ls -lh Forge-unsigned.ipa

      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: Forge-unsigned-ipa
          path: Forge-unsigned.ipa
          if-no-files-found: error
