name: CI

# Builds/tests Forge and produces artifacts (UI screenshots + an unsigned .ipa) on a
# GitHub-hosted macOS runner — the only build environment (the maintainer has no Mac).
#
# Xcode 16+ is required: XcodeGen emits the Xcode-16 project format (objectVersion 77),
# which Xcode 15.x cannot open. The .xcodeproj is generated from project.yml each run.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  XCODE_VERSION: "16.2"
  SIMULATOR_NAME: "iPhone 16"

jobs:
  build-test:
    name: Build, test & screenshots (iOS Simulator)
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build & test
        run: |
          xcodebuild test \
            -project Iron.xcodeproj \
            -scheme Iron \
            -destination "platform=iOS Simulator,name=${SIMULATOR_NAME},OS=latest" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: TestResults.xcresult
          if-no-files-found: ignore

  package-ipa:
    name: Package unsigned .ipa (AltStore / SideStore)
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned (Release, device)
        run: |
          xcodebuild build \
            -project Iron.xcodeproj \
            -scheme Iron \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package .ipa
        run: |
          set -euo pipefail
          APP="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)"
          echo "Packaging: $APP"
          rm -rf Payload
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry Forge-unsigned.ipa Payload
          ls -lh Forge-unsigned.ipa

      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: Forge-unsigned-ipa
          path: Forge-unsigned.ipa
          if-no-files-found: error
